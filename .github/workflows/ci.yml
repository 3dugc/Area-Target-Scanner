name: CI

on:
  push:
    branches: [main, master, develop, publish]
  pull_request:
    branches: [main, master, develop, publish]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libgomp1 libsm6 libxext6 libxrender1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r web_service/requirements.txt
          pip install -r requirements-dev.txt

      - name: Prepare fixed iOS OpenCV framework for UPM content tests
        run: |
          mkdir -p native_visual_localizer/opencv_ios
          curl --fail --location --retry 3 --retry-delay 2 \
            https://github.com/opencv/opencv/releases/download/4.10.0/opencv-4.10.0-ios-framework.zip \
            --output native_visual_localizer/opencv_ios/opencv_ios.zip
          unzip -q native_visual_localizer/opencv_ios/opencv_ios.zip \
            -d native_visual_localizer/opencv_ios
          test -d native_visual_localizer/opencv_ios/opencv2.framework

      - name: Run Phase 1 Python tests
        run: python -m pytest --import-mode=importlib tests/phase1 tests/ -v --tb=short

      - name: Validate package metadata
        run: python tools/phase0/check_package_metadata.py unity_plugin/AreaTargetPlugin/package.json

  web-service-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build web service image
        run: docker build -t area-target-scanner-web-service-ci .

  native-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r web_service/requirements.txt
          pip install -r requirements-dev.txt

      - name: Install native dependencies
        run: brew install cmake opencv

      - name: Build iOS native artifact and cache OpenCV framework
        run: native_visual_localizer/build_ios.sh

      - name: Run Phase 1 non-device release gates
        run: tools/phase1/verify.sh ci

  # Unity EditMode, clean UPM installation, Unity iOS export, generic Xcode
  # linking and device smoke remain local release gates. verify.sh ci emits
  # explicit SKIP reasons instead of treating unavailable Unity/iOS signing as PASS.

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: >
          ruff check
          processing_pipeline/feature_extraction.py
          processing_pipeline/optimized_pipeline.py
          processing_pipeline/uv_unwrap.py
          web_service/app.py
          tests/test_efficiency_profiles.py
          tests/test_uv_unwrap_worker.py
          tests/test_web_job_store.py
          tests/test_xatlas_native_helper.py
          --select=E,F,W
          --ignore=E501
