name: CI

on:
  push:
    branches: [main, master, develop, publish]
  pull_request:
    branches: [main, master, develop, publish]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    needs: native-macos
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libusb-1.0-0 libidn2-0 libgl1 libglib2.0-0 libgomp1 libsm6 libxext6 libxrender1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r web_service/requirements.txt
          pip install -r requirements-dev.txt

      - name: Use rebuilt OpenCV 5 native artifacts for UPM tests
        uses: actions/download-artifact@v4
        with:
          name: opencv5-native
          path: .

      - name: Run Phase 1 Python tests
        run: python tools/opencv5/run_regression.py --import-mode=importlib

      - name: Validate package metadata
        run: python tools/phase0/check_package_metadata.py unity_plugin/AreaTargetPlugin/package.json

  web-service-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build web service image
        run: docker build -t area-target-scanner-web-service-ci .

  native-macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r web_service/requirements.txt
          pip install -r requirements-dev.txt

      - name: Install native dependencies
        run: |
          brew install cmake
          bash tools/opencv5/build_dependency.sh "$RUNNER_TEMP/area-target-opencv5"
          echo "OpenCV_DIR=$RUNNER_TEMP/area-target-opencv5/install/lib/cmake/opencv5" >> "$GITHUB_ENV"

      - name: Build iOS native artifact and cache OpenCV framework
        run: native_visual_localizer/build_ios.sh --deploy

      - name: Run Phase 1 non-device release gates
        run: tools/phase1/verify.sh ci

      - name: Share verified native artifacts with Python content tests
        uses: actions/upload-artifact@v4
        with:
          name: opencv5-native
          if-no-files-found: error
          path: |
            unity_project/Assets/Plugins/iOS/libvisual_localizer.a
            unity_project/Assets/Plugins/macOS/libvisual_localizer.dylib
            native_visual_localizer/opencv_ios/5.0.0/opencv2.framework

  # Unity EditMode, clean UPM installation, Unity iOS export, generic Xcode
  # linking and device smoke remain local release gates. verify.sh ci emits
  # explicit SKIP reasons instead of treating unavailable Unity/iOS signing as PASS.

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: >
          ruff check
          processing_pipeline/feature_extraction.py
          processing_pipeline/optimized_pipeline.py
          processing_pipeline/uv_unwrap.py
          web_service/app.py
          tests/test_efficiency_profiles.py
          tests/test_uv_unwrap_worker.py
          tests/test_web_job_store.py
          tests/test_xatlas_native_helper.py
          --select=E,F,W
          --ignore=E501
