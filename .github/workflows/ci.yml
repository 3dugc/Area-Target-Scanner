name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libgomp1 libsm6 libxext6 libxrender1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r web_service/requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Phase 0 tests
        run: python -m pytest tests/ -v --tb=short

      - name: Validate package metadata
        run: python tools/phase0/check_package_metadata.py unity_plugin/AreaTargetPlugin/package.json

      - name: Build and inspect UPM package
        run: |
          python tools/phase0/build_upm_package.py
          python -m pytest tests/phase0/test_upm_package.py -v

  web-service-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build web service image
        run: docker build -t area-target-scanner-web-service-ci .

  native-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install native dependencies
        run: brew install cmake opencv

      - name: Build and verify native library
        run: native_visual_localizer/build_macos.sh

      - name: Verify iOS archive contract
        run: tools/phase0/check_native_symbols.sh unity_project/Assets/Plugins/iOS/libvisual_localizer.a

  # Unity EditMode and clean-package installation remain required local release
  # gates until a valid Unity license is configured in repository secrets.

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: >
          ruff check
          processing_pipeline/feature_extraction.py
          processing_pipeline/optimized_pipeline.py
          processing_pipeline/uv_unwrap.py
          web_service/app.py
          tests/test_efficiency_profiles.py
          tests/test_uv_unwrap_worker.py
          tests/test_web_job_store.py
          tests/test_xatlas_native_helper.py
          --select=E,F,W
          --ignore=E501
