name: Registry credentials check

on:
  push:
    branches: [develop, main, publish]
    paths:
      - .github/workflows/registry-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-login:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check inherited secret availability
        env:
          REGISTRY_USERNAME: ${{ secrets.TENCENT_REGISTRY_USERNAME || secrets.TENCENT_REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.TENCENT_REGISTRY_PASSWORD }}
        run: |
          test -n "$REGISTRY_USERNAME" || { echo "::error::Registry username secret is missing"; exit 1; }
          test -n "$REGISTRY_PASSWORD" || { echo "::error::Registry password secret is missing"; exit 1; }

      - name: Verify Tencent Hong Kong registry login
        uses: docker/login-action@v4
        with:
          registry: hkccr.ccs.tencentyun.com
          username: ${{ secrets.TENCENT_REGISTRY_USERNAME || secrets.TENCENT_REGISTRY_USER }}
          password: ${{ secrets.TENCENT_REGISTRY_PASSWORD }}
